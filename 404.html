<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030303">
  <title>Page Not Found — Between the Walls</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#030303;
      --fg:#eee9df;
      --muted:#88827a;
      --gold:#ddbd71;
      --line:rgba(238,233,223,.14);
      --serif:'Cormorant Garamond',Georgia,serif;
      --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:#030303;
      color:var(--fg);
    }

    body{
      min-height:100svh;
      overflow:hidden;
      font-family:var(--sans);
      -webkit-font-smoothing:antialiased;
      background:
        radial-gradient(circle at 50% 42%,rgba(221,189,113,.055),transparent 30%),
        radial-gradient(circle at 18% 84%,rgba(86,4,4,.08),transparent 25%),
        #030303;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.14;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.018) 0,
          rgba(255,255,255,.018) 1px,
          transparent 1px,
          transparent 4px
        );
      mix-blend-mode:screen;
    }

    header{
      position:fixed;
      z-index:5;
      top:0;
      left:0;
      right:0;
      height:76px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 clamp(18px,4vw,58px);
      border-bottom:1px solid var(--line);
      background:rgba(3,3,3,.72);
      backdrop-filter:blur(10px);
    }

    .logo{
      height:42px;
      width:auto;
      display:block;
    }

    .play-link{
      color:var(--fg);
      font-size:11px;
      font-weight:400;
      letter-spacing:.18em;
      text-transform:uppercase;
      text-decoration:none;
      transition:color .25s ease, text-shadow .25s ease;
    }

    .play-link:hover{
      color:var(--gold);
      text-shadow:0 0 16px rgba(221,189,113,.38);
    }

    .tri{
      color:var(--gold);
      margin-left:5px;
    }

    main{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:118px 24px 76px;
      text-align:center;
    }

    .wrap{
      width:min(720px,100%);
    }

    .code{
      margin:0 0 18px;
      color:var(--gold);
      font-size:10px;
      letter-spacing:.42em;
      text-indent:.42em;
      text-transform:uppercase;
    }

    h1{
      margin:0;
      font-family:var(--serif);
      font-size:clamp(5rem,18vw,10rem);
      font-weight:400;
      line-height:.78;
      letter-spacing:-.03em;
      color:#f2ede4;
      text-shadow:0 10px 60px rgba(0,0,0,.65);
    }

    .rule{
      width:72px;
      height:1px;
      margin:34px auto 28px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent);
      opacity:.8;
    }

    h2{
      margin:0 0 12px;
      font-family:var(--serif);
      font-size:clamp(1.65rem,5vw,2.5rem);
      font-weight:400;
    }

    p{
      width:min(480px,100%);
      margin:0 auto;
      color:var(--muted);
      font-size:14px;
      line-height:1.75;
    }

    .actions{
      margin-top:34px;
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:12px;
    }

    .button{
      min-width:168px;
      padding:13px 19px;
      border:1px solid rgba(238,233,223,.2);
      color:#d9d3ca;
      background:rgba(255,255,255,.018);
      text-decoration:none;
      text-transform:uppercase;
      font-size:10px;
      letter-spacing:.16em;
      transition:
        border-color .25s ease,
        color .25s ease,
        background .25s ease,
        transform .25s ease;
    }

    .button:hover{
      color:var(--fg);
      border-color:rgba(221,189,113,.55);
      background:rgba(221,189,113,.045);
      transform:translateY(-1px);
    }

    .whisper{
      position:fixed;
      left:50%;
      bottom:22px;
      transform:translateX(-50%);
      white-space:nowrap;
      color:rgba(238,233,223,.22);
      font-family:var(--serif);
      font-style:italic;
      font-size:12px;
      letter-spacing:.06em;
      user-select:none;
    }

    @media(max-width:820px){
      header{
        height:66px;
        padding:0 16px;
      }

      .logo{height:36px}

      main{
        padding:98px 20px 72px;
      }

      .actions{
        flex-direction:column;
        align-items:center;
      }

      .button{
        width:min(280px,100%);
      }

      .whisper{
        bottom:14px;
        font-size:11px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html" aria-label="Between the Walls home">
      <img src="images/logo.png" alt="Between the Walls" class="logo">
    </a>

    <a href="register.html" class="play-link" aria-label="Play">
      PLAY <span class="tri">▷</span>
    </a>
  </header>

  <main>
    <div class="wrap">
      <p class="code">Error</p>
      <h1>404</h1>
      <div class="rule"></div>

      <h2>Nothing was found behind this wall.</h2>
      <p>
        The page may have moved, expired, or never existed.
        Return to the film and try another path.
      </p>

      <div class="actions">
        <a class="button" href="index.html">Return to film</a>
        <a class="button" href="register.html">Enter experience</a>
      </div>
    </div>
  </main>

  <div class="whisper" aria-hidden="true">Some doors are not meant to open.</div>
</body>
</html>
